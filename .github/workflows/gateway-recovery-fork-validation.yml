name: Gateway recovery fork validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact recovery source commit
        uses: actions/checkout@v4
        with:
          ref: a9612e98baa6db7c8e01f7ce3415a3d7c12b5ad6
          persist-credentials: false

      - name: Verify source identity
        run: test "$(git rev-parse HEAD)" = a9612e98baa6db7c8e01f7ce3415a3d7c12b5ad6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Focused fence, inspect, and lifecycle tests
        run: >-
          pnpm test
          src/gateway/session-run-recovery-fence.test.ts
          src/gateway/session-run-recovery-inspect-service.test.ts
          src/gateway/session-run-recovery-custody.test.ts
          src/auto-reply/reply/queue/state.test.ts
          src/sessions/session-recovery-admission-snapshot.test.ts
          src/gateway/server-methods/sessions-recovery-inspect.test.ts
          src/gateway/server-methods/chat-pending-inputs.test.ts
          src/gateway/session-lifecycle-state.persistence.test.ts
          src/gateway/session-lifecycle-state.recovery.test.ts
          src/config/sessions/session-accessor.pending-inputs.test.ts
          src/auto-reply/reply/agent-runner-direct-runtime-config.test.ts
          src/auto-reply/reply/agent-runner.runreplyagent.e2e.test.ts
          src/auto-reply/reply/agent-runner.private-final.runreplyagent.test.ts
          src/auto-reply/reply/followup-delivery.test.ts
          src/auto-reply/reply/queue/enqueue.steering.test.ts
          src/state/run-recovery-queue-coordinator.test.ts
          src/state/run-recovery-queue-coordinator-broker.test.ts
          src/auto-reply/reply/queue/recovery-ingress.test.ts

      - name: Core typecheck
        run: pnpm tsgo:core

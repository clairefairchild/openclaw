name: Gateway recovery fork validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact recovery branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source identity
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Focused followup custody tests
        run: >-
          pnpm test
          src/auto-reply/reply/queue/recovery-custody.test.ts
          src/auto-reply/reply/queue.in-flight.test.ts
          src/auto-reply/reply/queue.collect.test.ts
          src/auto-reply/reply/followup-runner.test.ts
          src/state/run-recovery-queue-coordinator.test.ts
      - name: Core typecheck
        run: pnpm tsgo:core
